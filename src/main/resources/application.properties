server.servlet.context-path=/springboot3-springmvc
server.port=8080
spring.application.name=springboot3-springmvc

# Http Client
http.client.pool.max-total-connection=200
http.client.pool.max-connection-per-route=50

# Rest Client
rest.client.connect-timeout=4000
rest.client.connection-request-timeout=4000
rest.client.response-timeout=4000

# Zxcv1
zxcv1.base-url=https://zxcv1.free.beeceptor.com
zxcv1.get-test-url=${zxcv1.base-url}/get-test
zxcv1.post-test-url=${zxcv1.base-url}/post-test
